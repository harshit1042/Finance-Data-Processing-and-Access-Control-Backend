# Database: Docker Compose MySQL (see docker-compose.yml). Start with: docker compose up -d
# JWT: use a strong secret in production (HS256 needs >= 32 bytes).
jwt:
  secret: "dev-only-change-in-production-min-32-chars!!"
  expiration-ms: 86400000

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:mysql://localhost:3307/finance_db?allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
